name: Smoke Tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run V1 evidence-model smoke test
        run: python tests/smoke_test.py
      - name: Run V2 utility-model smoke test
        run: python tests/utility_v2_smoke_test.py
      - name: Run V3 Northern Virginia smoke test
        run: python tests/nova_v3_smoke_test.py
      - name: Run V4 candidate-pathway smoke test
        run: python tests/site_pathway_v4_smoke_test.py
